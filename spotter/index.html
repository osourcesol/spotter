<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel route planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2937; background: #f3f4f6; }
    header { background: #111827; color: #fff; padding: 12px 20px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    form { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 20px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    label { display: flex; flex-direction: column; font-size: 12px; color: #6b7280; gap: 4px; flex: 1 1 220px; }
    input { padding: 9px 10px; font-size: 15px; border: 1px solid #d1d5db; border-radius: 6px; }
    button { align-self: flex-end; padding: 10px 22px; font-size: 15px; font-weight: 600; color: #fff; background: #2563eb; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #93c5fd; cursor: wait; }
    #status { padding: 8px 20px; min-height: 34px; font-size: 14px; color: #374151; }
    #status.error { color: #b91c1c; font-weight: 600; }
    #map { height: 520px; margin: 0 20px; border-radius: 8px; border: 1px solid #d1d5db; background: #dbeafe; }
    #summary { padding: 16px 20px 40px; }
    .totals { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 16px; }
    .card b { display: block; font-size: 22px; }
    .card span { font-size: 12px; color: #6b7280; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #f3f4f6; }
    th { background: #f9fafb; font-size: 12px; color: #6b7280; text-transform: uppercase; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .note { font-size: 13px; color: #4b5563; margin: 10px 0 0; }
    details { margin: 10px 20px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 14px; }
    summary { cursor: pointer; font-weight: 600; font-size: 14px; }
    .settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 12px; }
    .settings-grid label { flex: none; color: #374151; font-weight: 600; }
    .settings-grid small { color: #6b7280; font-size: 11px; font-weight: 400; line-height: 1.35; }
    button.secondary { align-self: auto; background: #fff; color: #374151; border: 1px solid #d1d5db; padding: 8px 16px; font-size: 13px; }
    .stop-pin { width: 24px; height: 24px; line-height: 24px; text-align: center; font-size: 12px; font-weight: 700;
                color: #fff; background: #f59e0b; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  </style>
</head>
<body>
  <header><h1>Fuel route planner</h1></header>

  <form id="form">
    <label>Start (USA)
      <input id="start" value="Los Angeles, CA" required>
    </label>
    <label>Finish (USA)
      <input id="finish" value="New York, NY" required>
    </label>
    <button id="go" type="submit">Plan route</button>
  </form>

  <details id="settings">
    <summary>Planning rules (change them and plan again)</summary>
    <div id="settings-fields" class="settings-grid">Loading the rules...</div>
    <p><button type="button" id="reset" class="secondary">Reset to defaults</button></p>
  </details>

  <div id="status"></div>
  <div id="map"></div>
  <div id="summary"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Set by the server from MAP_TILE_URL / MAP_TILE_ATTRIBUTION in .env.
    // Empty means: no street tiles, so draw the bundled US state outlines instead.
    const TILE_URL = __TILE_URL__;
    const TILE_ATTRIBUTION = __TILE_ATTRIBUTION__;

    const map = L.map("map").setView([39.5, -98.35], 4);
    let routeLayer = null;

    if (TILE_URL) {
      L.tileLayer(TILE_URL, {maxZoom: 19, attribution: TILE_ATTRIBUTION}).addTo(map);
    } else {
      fetch("/us-states.json")
        .then((response) => response.json())
        .then((states) => {
          L.geoJSON(states, {
            style: {color: "#9ca3af", weight: 1, fillColor: "#ffffff", fillOpacity: 1},
            interactive: false
          }).addTo(map).bringToBack();
        })
        .catch(() => {});   // the route still draws without the outlines
    }

    const $ = (id) => document.getElementById(id);
    const usd = (n) => "$" + Number(n).toFixed(2);
    // Station names come from data, so escape them before putting them into HTML.
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

    let optionSpecs = [];

    function buildSettings(specs) {
      optionSpecs = specs;
      $("settings-fields").innerHTML = specs.map((s) =>
        "<label>" + esc(s.label) +
        "<input type='number' id='opt-" + esc(s.key) + "' value='" + esc(s.default) + "' min='" + esc(s.min) +
        "' max='" + esc(s.max) + "' step='" + esc(s.step) + "'>" +
        "<small>" + esc(s.help) + "</small></label>").join("");
    }

    function currentOptions() {
      const options = {};
      optionSpecs.forEach((s) => {
        const raw = $("opt-" + s.key).value;
        if (raw !== "") options[s.key] = Number(raw);
      });
      return options;
    }

    $("reset").addEventListener("click", () => {
      optionSpecs.forEach((s) => { $("opt-" + s.key).value = s.default; });
    });

    fetch("/api/options/")
      .then((response) => response.json())
      .then((body) => buildSettings(body.options))
      .catch(() => { $("settings-fields").textContent = "Could not load the rules; the defaults will be used."; });

    function describeError(body) {
      if (!body.details) return body.error || "The request failed.";
      const parts = [];
      const walk = (prefix, value) => {
        if (Array.isArray(value)) parts.push(prefix + ": " + value.join(" "));
        else if (value && typeof value === "object") Object.keys(value).forEach((k) => walk(prefix ? prefix + "." + k : k, value[k]));
        else parts.push(prefix + ": " + value);
      };
      walk("", body.details);
      return (body.error || "Invalid request") + " " + parts.join("; ");
    }

    function setStatus(text, isError) {
      $("status").textContent = text;
      $("status").className = isError ? "error" : "";
    }

    function draw(plan) {
      if (routeLayer) map.removeLayer(routeLayer);
      routeLayer = L.geoJSON(plan.route_geojson, {
        style: (feature) => feature.geometry.type === "LineString" ? {color: "#2563eb", weight: 4, opacity: 0.85} : {},
        pointToLayer: (feature, latlng) => {
          const p = feature.properties;
          if (p.kind === "fuel_stop") {
            const icon = L.divIcon({className: "stop-pin", html: String(p.order), iconSize: [24, 24]});
            return L.marker(latlng, {icon: icon}).bindPopup(
              "<b>Stop " + esc(p.order) + ": " + esc(p.name) + "</b><br>" +
              esc(p.gallons) + " gal at $" + Number(p.price_per_gallon).toFixed(3) + "/gal<br>" +
              Number(p.off_route_miles).toFixed(1) + " mi off the route, location: " + esc(p.location_precision));
          }
          const isStart = p.kind === "start";
          return L.circleMarker(latlng, {
            radius: 9, color: "#ffffff", weight: 2, fillOpacity: 1,
            fillColor: isStart ? "#16a34a" : "#dc2626"
          }).bindPopup("<b>" + (isStart ? "Start" : "Finish") + "</b><br>" + esc(p.label));
        }
      }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), {padding: [30, 30]});
    }

    function render(plan) {
      const fill = plan.start_fill;
      const where = (s) => esc(s.name) + ", " + esc(s.city) + ", " + esc(s.state);
      const away = (s) => Number(s.off_route_miles).toFixed(1) + " mi";
      const precision = (s) => esc(s.location_precision);
      let approximate = false;
      let rows = "";
      if (fill) {
        const p = fill.priced_at;
        if (p.location_precision !== "station") approximate = true;
        rows += "<tr><td>Start</td><td class='num'>0</td><td>priced at " + where(p) + "</td>" +
                "<td class='num'>" + away(p) + "</td><td>" + precision(p) + "</td>" +
                "<td class='num'>$" + fill.price_per_gallon.toFixed(3) + "</td>" +
                "<td class='num'>" + fill.gallons.toFixed(2) + "</td><td class='num'>" + usd(fill.cost_usd) + "</td></tr>";
      }
      plan.fuel_stops.forEach((s) => {
        if (s.location_precision !== "station") approximate = true;
        rows += "<tr><td>" + esc(s.order) + "</td><td class='num'>" + s.mile_marker.toFixed(0) + "</td><td>" + where(s) + "</td>" +
                "<td class='num'>" + away(s) + "</td><td>" + precision(s) + "</td>" +
                "<td class='num'>$" + s.price_per_gallon.toFixed(3) + "</td>" +
                "<td class='num'>" + s.gallons.toFixed(2) + "</td><td class='num'>" + usd(s.cost_usd) + "</td></tr>";
      });
      const m = plan.meta;
      const source = m.cache_hit ? "answered from cache" : m.external_api_calls + " outside request" + (m.external_api_calls === 1 ? "" : "s");
      $("summary").innerHTML =
        "<div class='totals'>" +
          "<div class='card'><b>" + usd(plan.total_fuel_cost_usd) + "</b><span>total fuel cost</span></div>" +
          "<div class='card'><b>" + plan.distance_miles.toFixed(1) + " mi</b><span>distance</span></div>" +
          "<div class='card'><b>" + plan.fuel_gallons_total.toFixed(1) + " gal</b><span>fuel at " + plan.assumptions.mpg + " mpg</span></div>" +
          "<div class='card'><b>" + plan.fuel_stops.length + "</b><span>fuel stops after the first fill-up</span></div>" +
          "<div class='card'><b>" + m.compute_ms.toFixed(0) + " ms</b><span>" + esc(source) + "</span></div>" +
        "</div>" +
        "<table><thead><tr><th>#</th><th class='num'>Mile</th><th>Station</th><th class='num'>Off route</th><th>Location</th>" +
        "<th class='num'>Price/gal</th><th class='num'>Gallons</th><th class='num'>Cost</th></tr></thead><tbody>" + rows + "</tbody></table>" +
        (fill ? "<p class='note'>" + esc(fill.note) + "</p>" : "") +
        "<p class='note'><b>Rules used:</b> " + optionSpecs.map((s) => esc(s.label) + " = " + esc(plan.assumptions[s.key])).join(" &middot; ") + "</p>" +
        (approximate ? "<p class='note'>Location \"town centre\": the exact position of that station is not in the data, so its pin and its " +
                       "distance from the route are those of the middle of its town.</p>" : "");
    }

    $("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("go").disabled = true;
      setStatus("Planning the route...", false);
      try {
        const response = await fetch("/api/route/", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({start: $("start").value, finish: $("finish").value, options: currentOptions()})
        });
        const body = await response.json();
        if (!response.ok) {
          setStatus(describeError(body), true);
          return;
        }
        draw(body);
        render(body);
        setStatus("", false);
      } catch (error) {
        setStatus("Could not reach the server: " + error.message, true);
      } finally {
        $("go").disabled = false;
      }
    });
  </script>
</body>
</html>
